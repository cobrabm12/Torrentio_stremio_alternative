# Fly.io deployment config. See https://fly.io/docs/reference/configuration/
#
# Quick start:
#   fly launch --no-deploy        # or `fly apps create torrentplus`
#   fly volumes create torrentplus_data --size 1 --region ams
#   fly secrets set BASE_URL=https://<your-app>.fly.dev
#   fly deploy
#
# BASE_URL must match your real app domain or debrid playback links break.

app = "torrentplus"
primary_region = "ams"

[build]

[env]
  PORT = "7000"
  DATA_DIR = "/app/data"

[http_service]
  internal_port = 7000
  force_https = true
  # Scale to zero when idle to save cost (first request after idle is slower).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "torrentplus_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
